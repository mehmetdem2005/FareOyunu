name: TerraForge Godot 4.7.2 CI

on:
  push:
    branches:
      - feat/terraforge-mobile-addon
    paths:
      - "addons/terra_forge/**"
      # Only known non-runtime handoff/decision documents. Keep other JSON,
      # fixtures, scenes, scripts and workflow changes eligible for CI.
      - "!addons/terra_forge/HANDOFF_START_HERE_TR.md"
      - "!addons/terra_forge/UNUTULMAYACAKLAR_TR.md"
      - "!addons/terra_forge/P1_5_11_DECISION_LEDGER.json"
      - "!addons/terra_forge/P1_5_11_HYBRID_MASTER_PLAN_TR.md"
      - "!addons/terra_forge/ROADMAP_MASTER_TR.md"
      - "!addons/terra_forge/STATUS_AND_CHANGELOG_TR.md"
      - "!addons/terra_forge/RISKS_AND_DECISIONS_TR.md"
      - ".github/workflows/terraforge-ci.yml"
  # PR checks stay conservative, including docs-only PRs, to avoid
  # path-filtered required checks remaining pending.
  pull_request:
    paths:
      - "addons/terra_forge/**"
      - ".github/workflows/terraforge-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraforge-ci-${{ github.ref }}
  # Protect the running integration check; rapid experiment updates still
  # cancel superseded PR checks. GitHub may replace an older pending run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/feat/terraforge-mobile-addon' }}

jobs:
  godot-regressions:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: Godot 4.7.2 / regression group ${{ matrix.shard }}
    env:
      SHARD_NUMBER: ${{ matrix.shard }}
      SHARD_COUNT: ${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Install official Godot 4.7.2 stable
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: false
          name: godot

      - name: Create isolated CI-only Godot project
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/terraforge-ci-project"
          mkdir -p "$project/addons"
          cp -a "$GITHUB_WORKSPACE/addons/terra_forge" "$project/addons/terra_forge"
          cat >"$project/project.godot" <<'GODOTPROJECT'
          config_version=5

          [application]
          config/name="TerraForge CI Test Project"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          GODOTPROJECT
          echo "TEST_PROJECT=$project" >>"$GITHUB_ENV"
          echo "Godot binary:"
          godot --version
          echo "CI project: $project"

      - name: Check Bash test runner syntax
        shell: bash
        run: bash -n addons/terra_forge/tests/run_all.sh

      - name: Import project and parse addon scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path "$TEST_PROJECT" --editor --import 2>&1 | tee "$RUNNER_TEMP/terraforge-import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|Compile Error:|Failed to load script' "$RUNNER_TEMP/terraforge-import.log"; then
            echo "::error::Godot import/parse errors detected"
            exit 1
          fi

      - name: Verify Godot editor plugin loads in headless editor
        shell: bash
        run: |
          set -euo pipefail
          cat >>"$TEST_PROJECT/project.godot" <<'GODOTPLUGINS'

          [editor_plugins]
          enabled=PackedStringArray("res://addons/terra_forge/plugin.cfg")
          GODOTPLUGINS
          timeout 90s godot --headless --editor --path "$TEST_PROJECT" --quit-after 20 2>&1 | tee "$RUNNER_TEMP/terraforge-editor.log"
          if grep -E '^ERROR:|^SCRIPT ERROR:|Parse Error:|Parser Error:|Compile Error:|Failed to load' "$RUNNER_TEMP/terraforge-editor.log"; then
            echo "::error::Editor plugin produced Godot errors"
            exit 1
          fi

      - name: Run assigned TerraForge Godot regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash "$TEST_PROJECT/addons/terra_forge/tests/run_all.sh" "$TEST_PROJECT" godot "$SHARD_NUMBER" "$SHARD_COUNT" | tee "$RUNNER_TEMP/terraforge-test.log"

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## TerraForge headless regression tests'
            echo ''
            echo 'Target: Godot 4.7.2 stable on ubuntu-24.04; isolated temporary project'
            echo ''
            echo '```'
            if test -f "$RUNNER_TEMP/terraforge-test.log"; then
              tail -n 100 "$RUNNER_TEMP/terraforge-test.log"
            elif test -f "$RUNNER_TEMP/terraforge-import.log"; then
              tail -n 100 "$RUNNER_TEMP/terraforge-import.log"
            else
              echo 'No execution logs found'
            fi
            echo '```'
            echo ''
            echo 'Headless CI does not validate Android touch, Mobile Renderer GPU performance or phone thermals.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraforge-godot-4-7-2-logs-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/terraforge-import.log
            ${{ runner.temp }}/terraforge-editor.log
            ${{ runner.temp }}/terraforge-test.log
            ${{ runner.temp }}/terraforge-regressions/
          if-no-files-found: warn
          retention-days: 7
