name: TerraForge Godot 4.7.2 CI

on:
  push:
    branches:
      - feat/terraforge-mobile-addon
    paths:
      - "addons/terra_forge/**"
      # Only known non-runtime handoff/decision documents. Keep other JSON,
      # fixtures, scenes, scripts and workflow changes eligible for CI.
      - "!addons/terra_forge/HANDOFF_START_HERE_TR.md"
      - "!addons/terra_forge/UNUTULMAYACAKLAR_TR.md"
      - "!addons/terra_forge/P1_5_11_DECISION_LEDGER.json"
      - "!addons/terra_forge/P1_5_11_HYBRID_MASTER_PLAN_TR.md"
      - "!addons/terra_forge/ROADMAP_MASTER_TR.md"
      - "!addons/terra_forge/STATUS_AND_CHANGELOG_TR.md"
      - "!addons/terra_forge/RISKS_AND_DECISIONS_TR.md"
      - ".github/workflows/terraforge-ci.yml"
  # PR checks stay conservative, including docs-only PRs, to avoid
  # path-filtered required checks remaining pending.
  pull_request:
    paths:
      - "addons/terra_forge/**"
      - ".github/workflows/terraforge-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraforge-ci-${{ github.ref }}
  # Protect the running integration check; rapid experiment updates still
  # cancel superseded PR checks. GitHub may replace an older pending run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/feat/terraforge-mobile-addon' }}

jobs:
  godot-regressions:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: Godot 4.7.2 / regression group ${{ matrix.shard }}
    env:
      SHARD_NUMBER: ${{ matrix.shard }}
      SHARD_COUNT: ${{ strategy.job-total }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4

      - name: Install official Godot 4.7.2 stable
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: false
          name: godot

      - name: Create isolated CI-only Godot project
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/terraforge-ci-project"
          mkdir -p "$project/addons"
          cp -a "$GITHUB_WORKSPACE/addons/terra_forge" "$project/addons/terra_forge"
          cat >"$project/project.godot" <<'GODOTPROJECT'
          config_version=5

          [application]
          config/name="TerraForge CI Test Project"

          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          GODOTPROJECT
          echo "TEST_PROJECT=$project" >>"$GITHUB_ENV"
          echo "Godot binary:"
          godot --version
          echo "CI project: $project"

      - name: Check Bash test runner syntax
        shell: bash
        run: bash -n addons/terra_forge/tests/run_all.sh

      - name: Import project and parse addon scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s godot --headless --path "$TEST_PROJECT" --editor --import 2>&1 | tee "$RUNNER_TEMP/terraforge-import.log"
          if grep -E 'SCRIPT ERROR:|Parse Error:|Parser Error:|Compile Error:|Failed to load script' "$RUNNER_TEMP/terraforge-import.log"; then
            echo "::error::Godot import/parse errors detected"
            exit 1
          fi

      - name: Verify Godot editor plugin loads in headless editor
        shell: bash
        run: |
          set -euo pipefail
          cat >>"$TEST_PROJECT/project.godot" <<'GODOTPLUGINS'

          [editor_plugins]
          enabled=PackedStringArray("res://addons/terra_forge/plugin.cfg")
          GODOTPLUGINS
          timeout 90s godot --headless --editor --path "$TEST_PROJECT" --quit-after 20 2>&1 | tee "$RUNNER_TEMP/terraforge-editor.log"
          if grep -E '^ERROR:|^SCRIPT ERROR:|Parse Error:|Parser Error:|Compile Error:|Failed to load' "$RUNNER_TEMP/terraforge-editor.log"; then
            echo "::error::Editor plugin produced Godot errors"
            exit 1
          fi

      - name: Run assigned TerraForge Godot regression tests
        shell: bash
        run: |
          set -euo pipefail
          bash "$TEST_PROJECT/addons/terra_forge/tests/run_all.sh" "$TEST_PROJECT" godot "$SHARD_NUMBER" "$SHARD_COUNT" | tee "$RUNNER_TEMP/terraforge-test.log"

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## TerraForge headless regression tests'
            echo ''
            echo 'Target: Godot 4.7.2 stable on ubuntu-24.04; isolated temporary project'
            echo ''
            echo '```'
            if test -f "$RUNNER_TEMP/terraforge-test.log"; then
              tail -n 100 "$RUNNER_TEMP/terraforge-test.log"
            elif test -f "$RUNNER_TEMP/terraforge-import.log"; then
              tail -n 100 "$RUNNER_TEMP/terraforge-import.log"
            else
              echo 'No execution logs found'
            fi
            echo '```'
            echo ''
            echo 'Headless CI does not validate Android touch, Mobile Renderer GPU performance or phone thermals.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraforge-godot-4-7-2-logs-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/terraforge-import.log
            ${{ runner.temp }}/terraforge-editor.log
            ${{ runner.temp }}/terraforge-test.log
            ${{ runner.temp }}/terraforge-regressions/
          if-no-files-found: warn
          retention-days: 7

  e4-renderer-capability:
    if: ${{ (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'exp/p1511e4-') || startsWith(github.head_ref, 'exp/p1511i1-'))) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/terraforge-mobile-addon') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 stable
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: false
          name: godot
      - name: Install virtual display and software graphics drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth mesa-vulkan-drivers libgl1-mesa-dri vulkan-tools mesa-utils
      - name: Non-headless Compatibility and Mobile capability (software, not device)
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/e4-renderer"
          mkdir -p "$project/addons"
          cp -a addons/terra_forge "$project/addons/terra_forge"
          printf 'config_version=5\n[application]\nconfig/name="E4 renderer capability"\n' > "$project/project.godot"
          godot --headless --path "$project" --editor --import --quit
          export LIBGL_ALWAYS_SOFTWARE=1
          unset VK_ICD_FILENAMES VK_DRIVER_FILES VK_ADD_DRIVER_FILES
          mapfile -t icds < <(find /usr/share/vulkan/icd.d /etc/vulkan/icd.d -maxdepth 1 -type f -name 'lvp_icd*.json' 2>/dev/null | sort -u || true)
          printf 'Lavapipe ICD candidates: %s\n' "${icds[@]}"
          if [[ "${#icds[@]}" != 1 ]]; then echo "::error::Expected one installed Lavapipe ICD manifest"; exit 1; fi
          export VK_DRIVER_FILES="${icds[0]}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/e4-xdg"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a vulkaninfo --summary 2>&1 | tee "$RUNNER_TEMP/e4-vulkan-preflight.log"
          grep -q VK_KHR_surface "$RUNNER_TEMP/e4-vulkan-preflight.log" || { echo "::error::Vulkan surface extension unavailable"; exit 1; }
          grep -qi llvmpipe "$RUNNER_TEMP/e4-vulkan-preflight.log" || { echo "::error::Lavapipe device unavailable"; exit 1; }
          status=0
          for method in gl_compatibility mobile; do
            driver=opengl3
            if [[ "$method" == mobile ]]; then driver=vulkan; fi
            for probe in test_e4_mesh_buffer_probe test_e4_coalesce_probe test_e4_rendered_culling; do
              log="$RUNNER_TEMP/e4-$method-$probe.log"
              if ! timeout 180s xvfb-run -a godot --path "$project" --display-driver x11 --audio-driver Dummy --rendering-method "$method" --rendering-driver "$driver" --resolution 640x480 --script "res://addons/terra_forge/tests/$probe.gd" -- --require-renderer="$method" 2>&1 | tee "$log"; then status=1; fi
              if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log" || ! grep -q 'PASS: E4' "$log"; then status=1; fi
            done
            if [[ -f "$project/addons/terra_forge/tests/test_i1_rendered_terrain.gd" ]]; then
              log="$RUNNER_TEMP/e4-$method-i1-rendered-terrain.log"
              if ! timeout 300s xvfb-run -a godot --path "$project" --display-driver x11 --audio-driver Dummy --rendering-method "$method" --rendering-driver "$driver" --resolution 640x480 --script "res://addons/terra_forge/tests/test_i1_rendered_terrain.gd" -- --require-renderer="$method" 2>&1 | tee "$log"; then status=1; fi
              if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log" || ! grep -q 'PASS: I1' "$log"; then status=1; fi
            fi
            if [[ -f "$project/addons/terra_forge/tests/test_m1_rendered_micro.gd" ]]; then
              log="$RUNNER_TEMP/e4-$method-m1-micro.log"
              if ! timeout 180s xvfb-run -a godot --path "$project" --display-driver x11 --audio-driver Dummy --rendering-method "$method" --rendering-driver "$driver" --resolution 640x480 --script "res://addons/terra_forge/tests/test_m1_rendered_micro.gd" 2>&1 | tee "$log"; then status=1; fi
              if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log" || ! grep -q 'PASS: M1' "$log"; then status=1; fi
            fi
            if [[ -f "$project/addons/terra_forge/tests/test_m4_resource_lifecycle.gd" ]]; then
              for arm in immediate retain retain immediate; do
                sequence=${sequence:-0}
                sequence=$((sequence+1))
                log="$RUNNER_TEMP/e4-$method-lifecycle-$sequence-$arm.log"
                if ! timeout 90s xvfb-run -a godot --path "$project" --display-driver x11 --audio-driver Dummy --rendering-method "$method" --rendering-driver "$driver" --resolution 640x480 --script "res://addons/terra_forge/tests/test_m4_resource_lifecycle.gd" -- --require-renderer="$method" --arm="$arm" 2>&1 | tee "$log"; then status=1; fi
                if grep -E 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log" || ! grep -q 'PASS: M4 lifecycle' "$log"; then status=1; fi
              done
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e4-software-renderer-logs
          path: ${{ runner.temp }}/e4-*.log
