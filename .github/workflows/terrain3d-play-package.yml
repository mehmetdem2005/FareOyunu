name: TerraForge packed RF mobile candidate
on:
  push:
    branches: [fix/terraforge-rf-mobile-packed, experiment/terraforge-stroke-resampler, experiment/terraforge-smooth-native]
    paths: ["tools/terrain3d_runtime/**", "addons/terra_forge/**", ".github/workflows/terrain3d-play-package.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux, arch: x86_64, target: debug}
          - {platform: linux, arch: x86_64, target: release}
          - {platform: android, arch: arm64, target: debug}
          - {platform: android, arch: arm64, target: release}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: TokisanGames/Terrain3D
          ref: 629bbd65526bbdc3d1aa371840c7028055c30b02
          submodules: recursive
          path: upstream-native
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install scons==4.10.1
      - uses: nttld/setup-ndk@v1
        if: matrix.platform == 'android'
        id: ndk
        with:
          ndk-version: r28b
          link-to-sdk: true
      - name: Apply lossless RF upload patch and compile
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          python3 tools/terrain3d_runtime/native_patch/pack_rf.py upstream-native
          python3 tools/terrain3d_runtime/native_patch/brush_batch.py upstream-native
          cd upstream-native
          scons target=template_${{ matrix.target }} platform=${{ matrix.platform }} arch=${{ matrix.arch }} debug_symbols=no -j4
          test -s project/addons/terrain_3d/bin/libterrain.${{ matrix.platform }}.${{ matrix.target }}.${{ matrix.arch }}.so
      - uses: actions/upload-artifact@v4
        with:
          name: packed-${{ matrix.platform }}-${{ matrix.target }}-${{ matrix.arch }}
          path: upstream-native/project/addons/terrain_3d/bin/libterrain.${{ matrix.platform }}.${{ matrix.target }}.${{ matrix.arch }}.so
          if-no-files-found: error
  package:
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned native Terrain3D distribution
        run: bash tools/terrain3d_runtime/install_terrain3d.sh
      - uses: actions/download-artifact@v4
        with:
          pattern: packed-*
          path: ${{ runner.temp }}/packed-native
          merge-multiple: true
      - name: Replace stock native binaries with matching patched builds
        run: |
          addon=tools/terrain3d_runtime/addons/terrain_3d
          rm -rf "$addon/bin"
          mkdir -p "$addon/bin"
          cp "$RUNNER_TEMP/packed-native/"*.so "$addon/bin/"
          test "$(find "$addon/bin" -type f | wc -l)" -eq 4
          python3 - "$addon/terrain.gdextension" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          src = p.read_text()
          head, libs = src.split('[libraries]', 1)
          keep = [line for line in libs.splitlines() if line.startswith(('linux.debug.x86_64 =','linux.release.x86_64 =','android.debug.arm64 =','android.release.arm64 ='))]
          assert len(keep)==4
          p.write_text(head+'[libraries]\n'+'\n'.join(keep)+'\n')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline world baking dependencies
        run: python3 -m pip install numpy==2.2.6 scipy==1.15.3 pillow==11.2.1
      - name: Bake fixed full-size world (offline Float32)
        run: python3 tools/terrain3d_runtime/bake_world.py
      - uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: false
          name: godot
      - name: Install offline conversion graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Serialize native regions (package production, not FPS test)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/tools/terrain3d_runtime"
          xvfb-run -a godot --path "$project" --editor --import --quit --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy 2>&1 | tee "$RUNNER_TEMP/native-import.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/native-import.log"; then
            echo "Script import failed; stopping before native bake."
            exit 1
          fi
          timeout 240s xvfb-run -a godot --path "$project" --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 640x480 res://bake_native.tscn 2>&1 | tee "$RUNNER_TEMP/native-bake.log"
          grep -q 'NATIVE_SURFACE_MIPS_OK count=4' "$RUNNER_TEMP/native-bake.log"
          grep -q 'NATIVE_REGION_INDEX_OK count=64' "$RUNNER_TEMP/native-bake.log"
          grep -q 'NATIVE_BAKE_OK regions=64 exact_height_samples=16777216' "$RUNNER_TEMP/native-bake.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|NATIVE_BAKE_FAIL|Shader compilation failed' "$RUNNER_TEMP/native-bake.log"
          rm "$project/world/height.r32"
      - name: Native brush functional gate (not a performance benchmark)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/tools/terrain3d_runtime"
          timeout 90s xvfb-run -a godot --path "$project" --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --script res://authoring/native_brush_smoke.gd 2>&1 | tee "$RUNNER_TEMP/native-brush.log"
          grep -q 'TERRAFORGE_PACKED_RF_OK cpu_rf=true gpu_bytes_exact=true' "$RUNNER_TEMP/native-brush.log"
          grep -q "NATIVE_BRUSH_SMOKE_OK regions=2 raise_lower_undo_redo=true" "$RUNNER_TEMP/native-brush.log"
          ! grep -Eq "SCRIPT ERROR:|Parse Error:|NATIVE_BRUSH_SMOKE_FAIL|Shader compilation failed" "$RUNNER_TEMP/native-brush.log"
      - name: Package Godot project (no benchmark or regression suite)
        shell: bash
        run: |
          set -euo pipefail
          cd tools/terrain3d_runtime
          mkdir -p "$RUNNER_TEMP/TerraForge-Play-Godot"
          cp -a project.godot terraforge_workspace.tscn play.tscn play.gd terrain_runtime.gd session_recorder.gd preview_range.gd thermal_monitor.gd world shaders authoring README.md "$RUNNER_TEMP/TerraForge-Play-Godot/"
          mkdir -p "$RUNNER_TEMP/TerraForge-Play-Godot/addons"
          cp -a addons/terrain_3d "$RUNNER_TEMP/TerraForge-Play-Godot/addons/"
          cp -a addons/terraforge_native "$RUNNER_TEMP/TerraForge-Play-Godot/addons/"
          test ! -e "$RUNNER_TEMP/TerraForge-Play-Godot/addons/terra_forge"
          test -f "$RUNNER_TEMP/TerraForge-Play-Godot/addons/terraforge_native/plugin.cfg"
          cat >>"$RUNNER_TEMP/TerraForge-Play-Godot/project.godot" <<'GODOTPLUGINS'

          [editor_plugins]
          enabled=PackedStringArray("res://addons/terraforge_native/plugin.cfg")
          GODOTPLUGINS
      - name: Verify packaged native TerraForge editor starts
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/TerraForge-Play-Godot"
          timeout 120s xvfb-run -a godot --path "$package" --editor --import --quit --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy 2>&1 | tee "$RUNNER_TEMP/packaged-editor.log"
          ! grep -Ei 'SCRIPT ERROR:|Parse Error:|Parser Error:|Compile Error:|Failed to load script|Unable to load addon script|Error loading addon' "$RUNNER_TEMP/packaged-editor.log"
          grep -Fq 'enabled=PackedStringArray("res://addons/terraforge_native/plugin.cfg")' "$package/project.godot"
          # Exercise actual @tool editor lifecycle, not only a game SceneTree.
          # Inject only into the temporary CI package, then restore exact source.
          plugin="$package/addons/terraforge_native/plugin.gd"
          cp "$plugin" "$RUNNER_TEMP/native-plugin-original.gd"
          trap 'cp "$RUNNER_TEMP/native-plugin-original.gd" "$plugin"' EXIT
          python3 - "$plugin" "$GITHUB_WORKSPACE/tools/terrain3d_runtime/ci/editor_brush_smoke.inc" <<'PY'
          import sys
          from pathlib import Path
          plugin, snippet = map(Path, sys.argv[1:])
          src = plugin.read_text()
          needle = "    call_deferred(\"_on_selection_changed\")"
          assert needle in src
          src = src.replace(needle, needle + "\n    call_deferred(\"_ci_editor_brush_smoke\")", 1)
          plugin.write_text(src + "\n" + snippet.read_text())
          PY
          timeout 120s xvfb-run -a godot --path "$package" --editor res://terraforge_workspace.tscn --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy 2>&1 | tee "$RUNNER_TEMP/native-editor-brush.log"
          grep -q 'NATIVE_EDITOR_BRUSH_OK regions=16 radius=8 power=3 changed=' "$RUNNER_TEMP/native-editor-brush.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|NATIVE_EDITOR_BRUSH_FAIL|Shader compilation failed' "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_SMOOTH_OK" "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_MULTISCALE_OK" "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_SMOOTH_UI_OK" "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_NATIVE_BATCH_OK lower=true flatten=true undo=true" "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_STROKE_QUEUE_OK dabs=11" "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_UPLOAD_PROFILE_OK case=0" "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_UPLOAD_PROFILE_OK case=1" "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_RIDGE_VALLEY_OK signed=true undo=true" "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_WEATHER_OK mode=0" "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_WEATHER_OK mode=1" "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_SNAPSHOT_OK regions=16 no_reload=true" "$RUNNER_TEMP/native-editor-brush.log"
          TF_EDITOR_REOPEN=1 timeout 120s xvfb-run -a godot --path "$package" --editor res://terraforge_workspace.tscn --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy 2>&1 | tee "$RUNNER_TEMP/native-editor-reopen.log"
          grep -q "NATIVE_EDITOR_REOPEN_OK regions=16 exact_height_samples=4194304 maps_match=true" "$RUNNER_TEMP/native-editor-reopen.log"
          ! grep -Eq "SCRIPT ERROR:|Parse Error:|NATIVE_EDITOR_BRUSH_FAIL|Shader compilation failed" "$RUNNER_TEMP/native-editor-reopen.log"
          cp "$RUNNER_TEMP/native-plugin-original.gd" "$plugin"
          trap - EXIT
          cmp "$plugin" "$GITHUB_WORKSPACE/tools/terrain3d_runtime/addons/terraforge_native/plugin.gd"
          grep -q "NATIVE_EDITOR_LARGE_BRUSH_OK radius=29.5" "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_LARGE_BRUSH_OK radius=36" "$RUNNER_TEMP/native-editor-brush.log"
          grep -q "NATIVE_EDITOR_EXTERNAL_STORAGE_OK" "$RUNNER_TEMP/native-editor-brush.log"
          # Restore empty shipped workspace after disposable save verification.
          cp "$GITHUB_WORKSPACE/tools/terrain3d_runtime/terraforge_workspace.tscn" "$package/terraforge_workspace.tscn"
          rm -rf "$package/terraforge_data" "$package/.godot"
          cmp "$package/terraforge_workspace.tscn" "$GITHUB_WORKSPACE/tools/terrain3d_runtime/terraforge_workspace.tscn"
          echo "TERRAFORGE_NATIVE_EDITOR_PACKAGED"
      - uses: actions/upload-artifact@v4
        with:
          name: TerraForge-Packed-RF-Android-arm64-Linux-x86_64
          path: ${{ runner.temp }}/TerraForge-Play-Godot/
          include-hidden-files: true
