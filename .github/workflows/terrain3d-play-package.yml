name: TerraForge playable Godot package
on:
  push:
    branches: [feat/terraforge-terrain3d-runtime]
    paths: ["tools/terrain3d_runtime/**", "addons/terra_forge/**", ".github/workflows/terrain3d-play-package.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned native Terrain3D distribution
        run: bash tools/terrain3d_runtime/install_terrain3d.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline world baking dependencies
        run: python3 -m pip install numpy==2.2.6 scipy==1.15.3 pillow==11.2.1
      - name: Bake fixed full-size world (offline Float32)
        run: python3 tools/terrain3d_runtime/bake_world.py
      - uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.2-stable
          export-templates: false
          name: godot
      - name: Install offline conversion graphics dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Serialize native regions (package production, not FPS test)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/tools/terrain3d_runtime"
          xvfb-run -a godot --path "$project" --editor --import --quit --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy 2>&1 | tee "$RUNNER_TEMP/native-import.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:' "$RUNNER_TEMP/native-import.log"; then
            echo "Script import failed; stopping before native bake."
            exit 1
          fi
          timeout 240s xvfb-run -a godot --path "$project" --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --resolution 640x480 res://bake_native.tscn 2>&1 | tee "$RUNNER_TEMP/native-bake.log"
          grep -q 'NATIVE_SURFACE_MIPS_OK count=4' "$RUNNER_TEMP/native-bake.log"
          grep -q 'NATIVE_REGION_INDEX_OK count=64' "$RUNNER_TEMP/native-bake.log"
          grep -q 'NATIVE_BAKE_OK regions=64 exact_height_samples=16777216' "$RUNNER_TEMP/native-bake.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|NATIVE_BAKE_FAIL|Shader compilation failed' "$RUNNER_TEMP/native-bake.log"
          rm "$project/world/height.r32"
      - name: Native brush functional gate (not a performance benchmark)
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          project="$GITHUB_WORKSPACE/tools/terrain3d_runtime"
          timeout 90s xvfb-run -a godot --path "$project" --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --script res://authoring/native_brush_smoke.gd 2>&1 | tee "$RUNNER_TEMP/native-brush.log"
          grep -q "NATIVE_BRUSH_SMOKE_OK regions=2 raise_lower_undo_redo=true" "$RUNNER_TEMP/native-brush.log"
          ! grep -Eq "SCRIPT ERROR:|Parse Error:|NATIVE_BRUSH_SMOKE_FAIL|Shader compilation failed" "$RUNNER_TEMP/native-brush.log"
      - name: Package Godot project (no benchmark or regression suite)
        shell: bash
        run: |
          set -euo pipefail
          cd tools/terrain3d_runtime
          mkdir -p "$RUNNER_TEMP/TerraForge-Play-Godot"
          cp -a project.godot terraforge_workspace.tscn play.tscn play.gd terrain_runtime.gd session_recorder.gd preview_range.gd thermal_monitor.gd world shaders authoring README.md "$RUNNER_TEMP/TerraForge-Play-Godot/"
          mkdir -p "$RUNNER_TEMP/TerraForge-Play-Godot/addons"
          cp -a addons/terrain_3d "$RUNNER_TEMP/TerraForge-Play-Godot/addons/"
          cp -a addons/terraforge_native "$RUNNER_TEMP/TerraForge-Play-Godot/addons/"
          test ! -e "$RUNNER_TEMP/TerraForge-Play-Godot/addons/terra_forge"
          test -f "$RUNNER_TEMP/TerraForge-Play-Godot/addons/terraforge_native/plugin.cfg"
          cat >>"$RUNNER_TEMP/TerraForge-Play-Godot/project.godot" <<'GODOTPLUGINS'

          [editor_plugins]
          enabled=PackedStringArray("res://addons/terraforge_native/plugin.cfg")
          GODOTPLUGINS
      - name: Verify packaged native TerraForge editor starts
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/TerraForge-Play-Godot"
          timeout 120s xvfb-run -a godot --path "$package" --editor --import --quit --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy 2>&1 | tee "$RUNNER_TEMP/packaged-editor.log"
          ! grep -Ei 'SCRIPT ERROR:|Parse Error:|Parser Error:|Compile Error:|Failed to load script|Unable to load addon script|Error loading addon' "$RUNNER_TEMP/packaged-editor.log"
          grep -Fq 'enabled=PackedStringArray("res://addons/terraforge_native/plugin.cfg")' "$package/project.godot"
          # Exercise actual @tool editor lifecycle, not only a game SceneTree.
          # Inject only into the temporary CI package, then restore exact source.
          plugin="$package/addons/terraforge_native/plugin.gd"
          cp "$plugin" "$RUNNER_TEMP/native-plugin-original.gd"
          trap 'cp "$RUNNER_TEMP/native-plugin-original.gd" "$plugin"' EXIT
          python3 - "$plugin" "$GITHUB_WORKSPACE/tools/terrain3d_runtime/ci/editor_brush_smoke.inc" <<'PY'
          import sys
          from pathlib import Path
          plugin, snippet = map(Path, sys.argv[1:])
          src = plugin.read_text()
          needle = "    call_deferred(\"_on_selection_changed\")"
          assert needle in src
          src = src.replace(needle, needle + "\n    call_deferred(\"_ci_editor_brush_smoke\")", 1)
          plugin.write_text(src + "\n" + snippet.read_text())
          PY
          timeout 120s xvfb-run -a godot --path "$package" --editor res://terraforge_workspace.tscn --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy 2>&1 | tee "$RUNNER_TEMP/native-editor-brush.log"
          grep -q 'NATIVE_EDITOR_BRUSH_OK regions=1 radius=8 power=3 changed=' "$RUNNER_TEMP/native-editor-brush.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|NATIVE_EDITOR_BRUSH_FAIL|Shader compilation failed' "$RUNNER_TEMP/native-editor-brush.log"
          cp "$RUNNER_TEMP/native-plugin-original.gd" "$plugin"
          trap - EXIT
          cmp "$plugin" "$GITHUB_WORKSPACE/tools/terrain3d_runtime/addons/terraforge_native/plugin.gd"
          rm -rf "$package/.godot"
          echo "TERRAFORGE_NATIVE_EDITOR_PACKAGED"
      - uses: actions/upload-artifact@v4
        with:
          name: TerraForge-Play-Godot
          path: ${{ runner.temp }}/TerraForge-Play-Godot/
          include-hidden-files: true
